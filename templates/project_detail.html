<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project – My Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f11] text-gray-200 font-sans min-h-screen flex flex-col md:flex-row overflow-hidden">
    {% include '_sidebar.html' %}

    <main class="flex-1 min-w-0 min-h-0 flex flex-col overflow-hidden">
        <header class="shrink-0 border-b border-[#26262b] bg-[#141417] px-4 md:px-7 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex min-w-0 items-center gap-3">
                <a href="{{ url_for('projects_page') }}" class="shrink-0 rounded border border-[#3a3a44] px-3 py-2 text-xs font-bold text-gray-300 hover:bg-[#25252c]">← Projects</a>
                <div class="min-w-0">
                    <h1 id="project-title" class="truncate text-lg md:text-xl font-black text-gray-100">Loading project…</h1>
                    <div id="project-badges" class="mt-1 flex flex-wrap gap-2"></div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="project-save-status" class="text-[11px] text-gray-500" aria-live="polite"></span>
                <button id="delete-project" type="button" class="rounded border border-red-900/60 px-3 py-2 text-xs font-bold text-red-300 hover:bg-red-950/50">Delete Project</button>
            </div>
        </header>

        <section id="project-content" class="hidden flex-1 min-h-0 overflow-y-auto p-4 md:p-7">
            <div class="mx-auto flex min-h-full max-w-5xl flex-col">
                <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
                    <div>
                        <h2 class="text-sm font-black uppercase tracking-widest text-blue-300">Brainstorming Notes</h2>
                        <p class="mt-1 text-xs text-gray-500">Capture ideas, questions, plans, and anything else for this project. Your notes save automatically.</p>
                    </div>
                </div>
                <textarea id="project-ideas" rows="18" placeholder="Start brainstorming…"
                          class="min-h-[60vh] w-full flex-1 resize-y rounded-xl border border-[#34343d] bg-[#141417] p-5 text-sm leading-7 text-gray-100 placeholder:text-gray-600 shadow-lg focus:outline-none focus:border-blue-500"></textarea>
            </div>
        </section>

        <div id="project-load-error" class="hidden flex-1 items-center justify-center p-8 text-center">
            <div>
                <h2 class="font-bold text-red-300">Couldn’t load this project</h2>
                <p class="mt-2 text-sm text-gray-400">Go back to Projects and open it again. Your other projects are unchanged.</p>
            </div>
        </div>
    </main>

    <script>
        const projectId = {{ project_id|tojson }};
        let allProjects = [];
        let project = null;
        let loaded = false;
        let ideaTimer = null;
        let saveQueue = Promise.resolve();

        function setSaveStatus(text) {
            document.getElementById('project-save-status').textContent = text;
        }

        function queueSave() {
            if (!loaded) return Promise.resolve(false);
            const body = JSON.stringify({ projects: allProjects });
            setSaveStatus('Saving…');
            saveQueue = saveQueue.catch(() => {}).then(async () => {
                try {
                    const response = await fetch('/api/projects', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body
                    });
                    if (!response.ok) throw new Error('save failed');
                    setSaveStatus('Saved ✓');
                    return true;
                } catch (error) {
                    setSaveStatus('Save failed');
                    return false;
                }
            });
            return saveQueue;
        }

        function renderProjectHeader() {
            document.title = project.name + ' – Project';
            document.getElementById('project-title').textContent = project.name;
            const badges = document.getElementById('project-badges');
            badges.replaceChildren();
            if (project.priority) {
                const badge = document.createElement('span');
                badge.className = 'rounded-full border border-amber-700/70 bg-amber-950/50 px-2 py-1 text-[10px] font-bold uppercase text-amber-300';
                badge.textContent = '★ Priority'; badges.appendChild(badge);
            }
            if (project.deadline) {
                const badge = document.createElement('span');
                badge.className = 'rounded-full border border-blue-800/70 bg-blue-950/50 px-2 py-1 text-[10px] text-blue-200';
                badge.textContent = 'Deadline: ' + project.deadline; badges.appendChild(badge);
            }
        }

        document.getElementById('project-ideas').addEventListener('input', event => {
            if (!project) return;
            project.ideas = event.target.value;
            clearTimeout(ideaTimer);
            setSaveStatus('Saving…');
            ideaTimer = setTimeout(queueSave, 500);
        });

        document.getElementById('delete-project').addEventListener('click', async () => {
            if (!project || !confirm(`Delete “${project.name}” and all of its progress and to-dos?`)) return;
            allProjects = allProjects.filter(item => item.id !== projectId);
            if (await queueSave()) window.location.href = '/projects';
        });

        (async function loadProject() {
            try {
                const response = await fetch('/api/projects');
                if (!response.ok) throw new Error('load failed');
                const data = await response.json();
                allProjects = Array.isArray(data.projects) ? data.projects : [];
                project = allProjects.find(item => item.id === projectId);
                if (!project) throw new Error('project missing');
                document.getElementById('project-ideas').value = project.ideas || '';
                renderProjectHeader();
                document.getElementById('project-content').classList.remove('hidden');
                loaded = true;
                setSaveStatus('Synced ✓');
            } catch (error) {
                document.getElementById('project-content').classList.add('hidden');
                const errorPanel = document.getElementById('project-load-error');
                errorPanel.classList.remove('hidden'); errorPanel.classList.add('flex');
                document.getElementById('project-save-status').textContent = 'Not loaded';
            }
        })();
    </script>
</body>
</html>
