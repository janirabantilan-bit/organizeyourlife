<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects – My Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f11] text-gray-200 font-sans min-h-screen flex flex-col md:flex-row overflow-hidden">
    {% include '_sidebar.html' %}

    <main class="flex-1 min-w-0 min-h-0 flex flex-col overflow-hidden">
        <header class="shrink-0 border-b border-[#26262b] bg-[#141417] px-4 md:px-8 py-4 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-black uppercase tracking-wide text-gray-100">📁 Projects</h1>
                <p class="text-xs text-gray-400 mt-1">Keep ideas, completed progress, and next steps together.</p>
            </div>
            <span id="projects-sync-status" class="text-xs text-gray-500" aria-live="polite">Loading projects…</span>
        </header>

        <section class="flex-1 min-h-0 overflow-y-auto p-4 md:p-8">
            <div id="projects-grid" class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
        </section>
    </main>

    <div id="project-create-modal" class="hidden fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4">
        <form id="project-create-form" class="w-full max-w-md rounded-xl border border-[#3a3a44] bg-[#141417] p-5 md:p-6 shadow-2xl">
            <h2 class="text-lg font-black text-blue-300">New Project</h2>
            <p class="mt-1 text-xs text-gray-400">Name your project. Deadline and priority are optional.</p>

            <label for="project-name" class="mt-5 block text-xs font-bold uppercase text-gray-300">Name of project</label>
            <input id="project-name" type="text" maxlength="120" required placeholder="e.g. Launch my online store"
                   class="mt-1 w-full rounded border border-[#34343d] bg-[#1c1c21] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">

            <label for="project-deadline" class="mt-4 block text-xs font-bold uppercase text-gray-300">Deadline date <span class="font-normal normal-case text-gray-500">(optional)</span></label>
            <input id="project-deadline" type="date" class="mt-1 w-full rounded border border-[#34343d] bg-[#1c1c21] px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">

            <label class="mt-4 flex items-center gap-2 rounded border border-[#34343d] bg-[#1c1c21] px-3 py-2.5 text-sm text-gray-200">
                <input id="project-priority" type="checkbox" class="h-4 w-4 accent-amber-500">
                <span>Mark as priority</span>
                <span class="ml-auto text-[10px] text-gray-500">Priority projects appear first</span>
            </label>

            <div class="mt-6 flex justify-end gap-2">
                <button id="project-cancel" type="button" class="rounded px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
                <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-sm font-bold text-white hover:bg-blue-500">Create Project</button>
            </div>
        </form>
    </div>

    <script>
        let projectData = [];
        let projectsLoaded = false;
        const projectsGrid = document.getElementById('projects-grid');
        const projectsStatus = document.getElementById('projects-sync-status');
        const createModal = document.getElementById('project-create-modal');

        function newId(prefix) {
            return prefix + '_' + Math.random().toString(36).slice(2, 12);
        }

        function sortProjects(items) {
            return [...items].sort((a, b) => {
                if (!!a.priority !== !!b.priority) return a.priority ? -1 : 1;
                if (!!a.deadline !== !!b.deadline) return a.deadline ? -1 : 1;
                if (a.deadline && b.deadline && a.deadline !== b.deadline) return a.deadline.localeCompare(b.deadline);
                return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
            });
        }

        function makeProjectCard(project, rank) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'group relative min-h-[176px] w-full rounded-xl border-2 border-[#44444f] bg-[#141417] p-5 md:p-6 text-left shadow-lg transition hover:-translate-y-0.5 hover:border-blue-500 hover:bg-[#19191e] focus:outline-none focus:ring-2 focus:ring-blue-500';
            card.addEventListener('click', () => { window.location.href = '/projects/' + encodeURIComponent(project.id); });

            const top = document.createElement('div');
            top.className = 'flex items-start justify-between gap-3';
            const number = document.createElement('span');
            number.className = 'flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-blue-950 text-sm font-black text-blue-300';
            number.textContent = String(rank);
            top.appendChild(number);

            const badges = document.createElement('div');
            badges.className = 'flex flex-wrap justify-end gap-1.5';
            if (project.priority) {
                const badge = document.createElement('span');
                badge.className = 'rounded-full border border-amber-700/70 bg-amber-950/60 px-2 py-1 text-[10px] font-bold uppercase text-amber-300';
                badge.textContent = '★ Priority';
                badges.appendChild(badge);
            }
            if (project.deadline) {
                const badge = document.createElement('span');
                badge.className = 'rounded-full border border-blue-800/70 bg-blue-950/50 px-2 py-1 text-[10px] font-semibold text-blue-200';
                badge.textContent = 'Due ' + project.deadline;
                badges.appendChild(badge);
            }
            top.appendChild(badges);

            const name = document.createElement('h2');
            name.className = 'mt-5 break-words text-lg md:text-xl font-black leading-snug text-gray-100 group-hover:text-blue-200';
            name.textContent = project.name;
            card.append(top, name);

            const footer = document.createElement('div');
            footer.className = 'mt-4 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-gray-500';
            footer.textContent = `${(project.progress || []).length} progress updates · ${(project.todos || []).filter(item => !item.done).length} to do`;
            card.appendChild(footer);
            return card;
        }

        function renderProjects() {
            projectsGrid.replaceChildren();
            const ordered = sortProjects(projectData);
            ordered.forEach((project, index) => projectsGrid.appendChild(makeProjectCard(project, index + 1)));

            const addCard = document.createElement('button');
            addCard.type = 'button';
            addCard.className = 'min-h-[176px] w-full rounded-xl border-2 border-dashed border-[#44444f] bg-[#121214] p-5 md:p-6 text-center text-gray-400 transition hover:border-blue-500 hover:bg-blue-950/20 hover:text-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500';
            addCard.setAttribute('aria-label', 'Add a project');
            addCard.innerHTML = '<span class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-[#202027] text-3xl font-light">+</span><span class="mt-3 block text-sm font-bold uppercase tracking-wider">Add Project</span><span class="mt-1 block text-xs text-gray-500">Click anywhere in this box</span>';
            addCard.addEventListener('click', openProjectForm);
            projectsGrid.appendChild(addCard);
        }

        function openProjectForm() {
            if (!projectsLoaded) return;
            document.getElementById('project-create-form').reset();
            createModal.classList.remove('hidden');
            setTimeout(() => document.getElementById('project-name').focus(), 50);
        }

        async function saveProjects() {
            projectsStatus.textContent = 'Saving…';
            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ projects: projectData })
                });
                if (!response.ok) throw new Error('save failed');
                projectsStatus.textContent = 'Synced ✓';
                return true;
            } catch (error) {
                projectsStatus.textContent = 'Sync failed';
                return false;
            }
        }

        document.getElementById('project-create-form').addEventListener('submit', async event => {
            event.preventDefault();
            const name = document.getElementById('project-name').value.trim();
            if (!name) return;
            const project = {
                id: newId('project'),
                name,
                deadline: document.getElementById('project-deadline').value,
                priority: document.getElementById('project-priority').checked,
                ideas: '',
                progress: [],
                todos: [],
                created: new Date().toISOString()
            };
            projectData.push(project);
            renderProjects();
            createModal.classList.add('hidden');
            await saveProjects();
        });

        document.getElementById('project-cancel').addEventListener('click', () => createModal.classList.add('hidden'));
        createModal.addEventListener('click', event => {
            if (event.target === createModal) createModal.classList.add('hidden');
        });

        (async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                if (!response.ok) throw new Error('load failed');
                const data = await response.json();
                projectData = Array.isArray(data.projects) ? data.projects : [];
                projectsLoaded = true;
                projectsStatus.textContent = 'Synced ✓';
                renderProjects();
            } catch (error) {
                projectsStatus.textContent = 'Could not load projects';
            }
        })();
    </script>
</body>
</html>
